name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install detection pipeline test dependencies
        working-directory: lambda/detect
        run: |
          python3 -m venv venv
          venv/bin/pip install -r requirements-dev.txt

      - name: Run detection pipeline test suite
        working-directory: lambda/detect
        run: venv/bin/pytest -v

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform fmt check
        working-directory: infra
        run: terraform fmt -check -recursive

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for AWS OIDC federation
      contents: read
    steps:
      - uses: actions/checkout@v4

      # infra/detect.tf builds the Lambda's image with `docker build
      # --platform linux/arm64` (matching the Lambda's arm64 architecture),
      # but GitHub-hosted runners are amd64 — without QEMU registered,
      # `RUN` steps inside that build fail with "exec format error" (the
      # runner can start the build but can't execute arm64 binaries during
      # it). Must run before Terraform apply, since that's what invokes
      # the docker build via a local-exec provisioner.
      - name: Set up QEMU (for cross-arch Docker build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # No AWS access keys stored anywhere: this assumes an IAM role
      # directly via GitHub's OIDC token, trust-scoped to this exact repo
      # and the main branch only (see infra/github_oidc.tf).
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::268719686093:role/document-scanner-dev-github-actions-deploy
          aws-region: us-east-1

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve -no-color

      - name: Smoke test the deployed endpoint
        working-directory: infra
        run: |
          ENDPOINT=$(terraform output -raw detect_endpoint)
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST "$ENDPOINT" \
            -F "file=@../samples/appraisal-1.png")
          echo "HTTP status: $STATUS"
          cat /tmp/response.json
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: expected HTTP 200"
            exit 1
          fi
